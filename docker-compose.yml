services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docsup
      POSTGRES_USER: docsup
      POSTGRES_PASSWORD: docsup
    ports: ["5432:5432"]
    volumes: [docsup-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  docsup-postgres:
